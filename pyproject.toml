[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "phoenix-platform"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.package-dir]
"" = "platform"

[tool.setuptools.packages.find]
where = ["platform"]

[tool.pytest.ini_options]
pythonpath = ["platform"]
testpaths = ["tests"]
